<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="Программа тренировок">
  <title>Тренировки</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Тема применяется до отрисовки, чтобы тёмная тема не мигала белым.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main class="screen"><p class="muted">Загрузка…</p></main>
  </div>
  <noscript>Для работы приложения нужен включённый JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
